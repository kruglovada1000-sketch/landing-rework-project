<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вращающийся логотип ЧОП Рускорпорация</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: #000;
    overflow: hidden;
  }

  .logo-container {
    perspective: 1000px;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .logo {
    width: 400px;
    height: 400px;
    animation: rotateY 5s linear infinite;
    transform-style: preserve-3d;
  }

  @keyframes rotateY {
    0% {
      transform: rotateY(0deg);
    }
    100% {
      transform: rotateY(360deg);
    }
  }

  /* Опционально: добавить свечение */
  .logo-container::before {
    content: '';
    position: absolute;
    width: 500px;
    height: 500px;
    background: radial-gradient(circle, rgba(212, 175, 55, 0.15) 0%, transparent 70%);
    border-radius: 50%;
    animation: pulse 3s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% {
      transform: scale(1);
      opacity: 0.5;
    }
    50% {
      transform: scale(1.1);
      opacity: 0.8;
    }
  }
</style>
</head>
<body>

  <div class="logo-container">
    <img src="logo-shield.png" alt="ЧОП Рускорпорация" class="logo">
  </div>

</body>
</html>
